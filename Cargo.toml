[package]
name = "docserver"
version = "0.1.6"
edition = "2024"


[dependencies]
anyhow = "1.0.104"
crossbeam = "0.8.4"
hyper = { version = "1.11.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
log = "0.4.33"
pretty_env_logger = "0.5.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = [
    "fs",
    "macros",
    "io-std",
    "io-util",
    "rt",
    "rt-multi-thread", # so examples can use #[tokio::main]
    "sync",
    "time",
    "test-util",
    "signal",
] }
toml = "1.1.4"
zstd = "0.13.3"
tera = { version = "2", features = ["glob_fs"] }
serde_json = "1.0.151"
clap = { version = "4.6.4", features = ["derive", "env"] }
rand = "0.10.2"
shell-words = "1.1.1"
blake3 = "1.8.5"
ouroboros = "0.18.5"
semver = "1.0"
memmap2 = "0.9.11"
sysinfo = "0.39.6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
